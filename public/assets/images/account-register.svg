  <text x="72.5" y="42" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">200 PAGES</text>

  <!-- Title & category -->
  <rect x="20" y="225" width="360" height="80" rx="10" fill="#ffffff" stroke="#f1f5f9" />
  <text x="35" y="252" font-family="sans-serif" font-weight="800" font-size="14.5" fill="#0f172a">Executive Hard Bound Register</text>
  <text x="35" y="274" font-family="sans-serif" font-weight="600" font-size="12" fill="#4338ca">Registers & Files</text>
  <text x="35" y="292" font-family="sans-serif" font-weight="500" font-size="11" fill="#64748b">Sakshi Infotech Certified Original Product</text>
